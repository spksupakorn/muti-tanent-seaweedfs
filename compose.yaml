name: filestore

# Three networks, so a service can only reach what it needs. In particular the back office and the React app
# are on no network with SeaweedFS (its filer and master take unauthenticated requests):
#   db      Postgres and everything that talks to it
#   storage SeaweedFS and everything that talks to it
#   web     the HTTP services (the backend, the back office, the React app) and the test runner
networks:
  db:
  storage:
  web:

# What the API (and the test runner) needs: the signing key for tokens and the storage credentials.
x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
  POSTGRES_DB: ${POSTGRES_DB:-filestore}
  POSTGRES_HOST: postgres
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_BUCKET: ${S3_BUCKET:-files}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}

services:
  postgres:
    image: postgres:18-alpine
    networks: [db]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filestore}
      POSTGRES_USER: ${POSTGRES_USER:-filestore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
      DB_BACKOFFICE_PASSWORD: ${DB_BACKOFFICE_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # master + volume + filer + S3 in one process. The S3 identity file is rendered at start
  # because s3.json cannot read env vars. "backend" is limited to one bucket; "admin" exists
  # only so the test suite can prove that limit holds (shortcut: it is rendered in every deployment).
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    networks: [storage]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[
        {"name":"backend","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:%s","Write:%s","List:%s"]},
        {"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List"]}
        ]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$S3_BUCKET" "$$S3_BUCKET" "$$S3_BUCKET"
        "$$S3_ADMIN_ACCESS_KEY" "$$S3_ADMIN_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -master.volumeSizeLimitMB=256 -volume.max=100
        -filer -s3 -s3.config=/tmp/s3.json
    environment:
      S3_BUCKET: ${S3_BUCKET:-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?set in .env}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?set in .env}
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/"]
      interval: 3s
      timeout: 3s
      retries: 30

  storage-init:
    image: chrislusf/seaweedfs:4.52
    networks: [storage]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        out=$$(echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 2>&1);
        echo "$$out"; echo "$$out" | grep -qE "created bucket|already exists"
    environment:
      S3_BUCKET: ${S3_BUCKET:-files}
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  # Operator tool for storage status. Without a password it would bind loopback inside the
  # container (unreachable); with one it binds 0.0.0.0 in the container, and the host only
  # publishes it on 127.0.0.1.
  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.52
    networks: [storage]
    command: ["admin", "-master=seaweedfs:9333", "-dataDir=/data", "-port=12535"]
    environment:
      WEED_ADMIN_PASSWORD: ${SEAWEED_ADMIN_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:12535:12535"
    volumes:
      - seaweed-admin-data:/data
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:12535/login"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Schema changes run as the owner role, never as the API's role. Neither the API's signing key nor
  # storage credentials: it migrates every app, including the admin's own tables, only the back office uses.
  migrate:
    build: ./backend
    image: filestore-backend
    networks: [db]
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      DJANGO_SETTINGS_MODULE: config.backoffice_settings
      DJANGO_SECRET_KEY: ${BACKOFFICE_SECRET_KEY:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-filestore}
      POSTGRES_HOST: postgres
      POSTGRES_USER: filestore_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: filestore-backend
    networks: [db, storage, web]
    environment:
      <<: *backend-env
      POSTGRES_USER: filestore_app
      POSTGRES_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
      MASTER_KEY_FILE: /run/secrets/master_key  # the path inside the container; the host path is MASTER_KEY_HOST_FILE
    # Only the backend can unwrap Tenant keys; ops, migrate and tests never get the key.
    secrets:
      - master_key
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20

  # The back office for Platform operators: Django admin, as the back-office DB role. Its own secret key, and
  # deliberately NO master key, NO S3 credentials and NO network path to SeaweedFS: nothing here can read,
  # decrypt, overwrite or delete a stored file.
  # Create an operator with: docker compose run --rm ops create_user --operator you@example.com 'a-password'
  backoffice:
    build: ./backend
    image: filestore-backend
    networks: [db, web]
    environment:
      DJANGO_SETTINGS_MODULE: config.backoffice_settings
      DJANGO_SECRET_KEY: ${BACKOFFICE_SECRET_KEY:?set in .env}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backoffice
      POSTGRES_DB: ${POSTGRES_DB:-filestore}
      POSTGRES_HOST: postgres
      POSTGRES_USER: filestore_backoffice
      POSTGRES_PASSWORD: ${DB_BACKOFFICE_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20

  # The React app: static files from nginx. The browser calls the API at VITE_API_URL (baked in at build
  # time), so the backend must allow this origin (CORS_ALLOWED_ORIGINS defaults to 127.0.0.1:5173 / localhost:5173).
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
    networks: [web]
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Platform operator commands, as the back-office role (bypasses RLS on purpose):
  #   docker compose run --rm ops create_tenant "Acme"
  #   docker compose run --rm ops create_user alice@example.com 'a-password'
  #   docker compose run --rm ops add_membership alice@example.com "Acme" admin
  #   docker compose run --rm ops purge        # half-finished uploads > 1 h, Trash > 7 days (needs the Backup, see below)
  # It does not get the API's signing key: it signs no tokens.
  ops:
    profiles: ["ops"]
    build: ./backend
    image: filestore-backend
    networks: [db, storage]
    entrypoint: ["python", "manage.py"]
    environment:
      <<: *backend-env
      DJANGO_SECRET_KEY: ${BACKOFFICE_SECRET_KEY:?set in .env}
      POSTGRES_USER: filestore_backoffice
      POSTGRES_PASSWORD: ${DB_BACKOFFICE_PASSWORD:?set in .env}
      BACKUP_FILES_DIR: /backup/files
    volumes:
      # Read-only: `purge` only checks that the Backup has a copy before it deletes a trashed file's object.
      - ${BACKUP_DIR:-./backups}/files:/backup/files:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Runs `purge` every PURGE_INTERVAL seconds (default an hour): half-finished uploads older than an hour are
  # removed, and Trash older than 7 days once the Backup holds a copy (so, without the backup profile, only the
  # first). The first run comes one interval after start.
  maintenance:
    build: ./backend
    image: filestore-backend
    networks: [db, storage]
    entrypoint: ["/bin/sh", "-c"]
    command: ['while true; do sleep "$${PURGE_INTERVAL:-3600}"; python manage.py purge || echo "purge failed"; done']
    environment:
      <<: *backend-env
      DJANGO_SECRET_KEY: ${BACKOFFICE_SECRET_KEY:?set in .env}
      POSTGRES_USER: filestore_backoffice
      POSTGRES_PASSWORD: ${DB_BACKOFFICE_PASSWORD:?set in .env}
      BACKUP_FILES_DIR: /backup/files
      PURGE_INTERVAL: ${PURGE_INTERVAL:-3600}
    volumes:
      - ${BACKUP_DIR:-./backups}/files:/backup/files:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Backup, part 1: continuously copy the stored (encrypted) files to ${BACKUP_DIR}/files.
  # No -doDeleteFiles: a file purged or lost later stays in the Backup. The health-check objects are skipped.
  # -initialSnapshot also seeds files that exist before it starts (e.g. right after a restore).
  filer-backup:
    profiles: ["backup"]  # off for normal runs and tests, which would otherwise copy every test file into ./backups
    image: chrislusf/seaweedfs:4.52
    networks: [storage]
    command:
      - filer.backup
      - -filer=seaweedfs:8888
      - -filerPath=/buckets/${S3_BUCKET:-files}
      - -filerExcludePaths=/buckets/${S3_BUCKET:-files}/_health
      - -initialSnapshot
    volumes:
      - ./backup/replication.toml:/etc/seaweedfs/replication.toml:ro
      - ${BACKUP_DIR:-./backups}/files:/backup/files
    depends_on:
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Backup, part 2: a database dump, valid only once the file backup has caught up (see backup/db-backup.sh).
  # Take one now with: docker compose run --rm db-backup once
  db-backup:
    profiles: ["backup"]
    image: postgres:18-alpine
    networks: [db]
    entrypoint: ["/bin/sh", "/scripts/db-backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-filestore}
      PGUSER: filestore_backoffice
      PGPASSWORD: ${DB_BACKOFFICE_PASSWORD:?set in .env}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-3600}
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backup
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Restore (see scripts/restore-drill.sh): into a fresh stack, before the first full `up`.
  db-restore:
    profiles: ["restore"]
    image: postgres:18-alpine
    networks: [db]
    entrypoint: ["/bin/sh", "/scripts/restore-db.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-filestore}
      PGUSER: ${POSTGRES_USER:-filestore}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ./backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backup:ro

  # Copies the children of the backed-up tree (<tenant>/<file>) into the bucket; `filer.copy DIR` alone
  # would create the directory itself inside the target.
  files-restore:
    profiles: ["restore"]
    image: chrislusf/seaweedfs:4.52
    networks: [storage]
    entrypoint: ["/bin/sh", "-c"]
    command: ["weed filer.copy /backup/files/* http://seaweedfs:8888/buckets/$${S3_BUCKET}/"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-files}
    volumes:
      - ${BACKUP_DIR:-./backups}/files:/backup/files:ro

  # Runs inside the compose networks: the S3 port is not published to the host.
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/Dockerfile
    networks: [db, storage, web]
    environment:
      <<: *backend-env
      BACKEND_URL: http://backend:8000
      BACKOFFICE_URL: http://backoffice:8000
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?set in .env}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?set in .env}
      # Seeding runs the operator commands as the back-office role; RLS probes log in as each role.
      POSTGRES_USER: filestore_backoffice
      POSTGRES_PASSWORD: ${DB_BACKOFFICE_PASSWORD:?set in .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
    volumes:
      - ./tests:/tests:ro
      - ./backend:/app:ro
    depends_on:
      backend:
        condition: service_healthy
      backoffice:
        condition: service_healthy

secrets:
  master_key:
    file: ${MASTER_KEY_HOST_FILE:?absolute path of the master key file on this machine, outside the repo}

volumes:
  pgdata:
  seaweed-data:
  seaweed-admin-data:
